backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "berita"
    label: "Berita & Pengumuman"
    folder: "content/berita"
    create: true
    fields:
      - {label: "Judul Berita", name: "title", widget: "string"}
      - {label: "Tanggal", name: "date", widget: "datetime"}
      - {label: "Kategori", name: "category", widget: "string"}
      - {label: "Isi Pengumuman", name: "body", widget: "markdown"}
